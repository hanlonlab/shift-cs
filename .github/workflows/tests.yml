name: Tests and benchmarks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: |
          dotnet restore Shift.slnx
          dotnet format Shift.slnx --verify-no-changes --no-restore
          dotnet build Shift.slnx --configuration Release --no-restore -warnaserror
          dotnet test --solution Shift.slnx --configuration Release --no-build --no-restore --minimum-expected-tests 109
      - name: Performance benchmarks
        run: dotnet run --project benchmarks/Shift.Benchmarks/Shift.Benchmarks.csproj --configuration Release --no-build --no-restore -- --filter '*' --stopOnFirstError
      - name: Publish benchmark summary
        run: |
          {
            echo "## Benchmark results"
            echo
            cat bin/BenchmarkDotNet.Artifacts/results/*-report-github.md
          } | tee benchmark-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            benchmark-results.md
            bin/BenchmarkDotNet.Artifacts/

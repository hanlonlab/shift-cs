name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: |
          dotnet restore Shift.slnx
          dotnet format Shift.slnx --verify-no-changes --no-restore
          dotnet build Shift.slnx --configuration Release --no-restore -warnaserror
          dotnet test --solution Shift.slnx --configuration Release --no-build --no-restore --minimum-expected-tests 52
      - name: End-to-end performance benchmarks
        run: dotnet run --project benchmarks/Shift.Benchmarks/Shift.Benchmarks.csproj --configuration Release --no-build --no-restore -- --filter '*CommittedMessageEndToEndBenchmarks*' --stopOnFirstError
